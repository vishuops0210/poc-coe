name: CBOM POC with cdxgen

# Production-style CBOM pipeline. Single method, single artifact: cbom.json
# Tool: ghcr.io/cyclonedx/cdxgen (pinned by digest = immutable)
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  # Pinned image (digest from a verified pull — reproducible, production way)
  CDXGEN_IMAGE: ghcr.io/cyclonedx/cdxgen:latest@sha256:525bb244efee85f7bdc261b67a43e943dc4dc112e287b3450b4a86629ef1e4e7

jobs:
  cbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build demo app
        run: mvn -B package -DskipTests

      - name: Run crypto demo (proof it works)
        run: mvn -B org.codehaus.mojo:exec-maven-plugin:3.3.0:java -Dexec.mainClass="com.example.cbom.CryptoDemo"

      - name: Ensure demo keystore exists (cert inventory for CBOM)
        run: |
          if [ ! -f keystore.p12 ]; then
            keytool -genkeypair -alias demo -keyalg RSA -keysize 2048 \
              -storetype PKCS12 -keystore keystore.p12 \
              -storepass changeit -keypass changeit \
              -dname "CN=cbom-demo, OU=POC, O=Example, L=BLR, C=IN" -validity 365
          fi
          keytool -list -keystore keystore.p12 -storepass changeit | head -10

      # CBOM ONLY — dedicated `cbom` binary (CBOM-oriented defaults),
      # not the SBOM generator. --user root avoids EACCES on the mount.
      - name: Generate CBOM
        run: |
          docker run --rm --user root --entrypoint cbom \
            -v "${{ github.workspace }}:/app" -w /app \
            "$CDXGEN_IMAGE" \
            -t java --spec-version 1.6 --evidence -o cbom.json -p .
          sudo chown -R $USER:$USER "${{ github.workspace }}" || true
          test -f cbom.json || { echo "FATAL: cbom.json not generated"; exit 1; }
          head -c 1500 cbom.json; echo

      - name: CBOM gate (must contain crypto assets)
        run: |
          comps=$(jq '.components | length' cbom.json)
          cryptos=$(jq '[.components[] | select(.cryptoProperties != null or .type=="cryptographic-asset")] | length' cbom.json)
          echo "Components: $comps, crypto assets: $cryptos"
          {
            echo "## CBOM result"
            echo ""
            echo "Components: $comps, crypto assets: $cryptos"
            echo ""
            echo '```'
            jq -r '.components[] | select(.cryptoProperties != null) | "\(.name // .["bom-ref"])"' cbom.json | sort -u | head -40
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          if [ "$cryptos" -eq 0 ]; then
            echo "::warning::CBOM has 0 crypto assets — pipeline passes for the POC, flip this to exit 1 once baselined."
          fi

      - name: Upload CBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbom
          path: |
            cbom.json
            keystore.p12
