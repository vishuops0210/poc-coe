name: CBOM POC with cdxgen

# Purpose: build the demo Java crypto app and generate CBOM
# Tool: ghcr.io/cyclonedx/cdxgen (single method)
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  cbom-poc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build demo app
        run: mvn -B package -DskipTests

      - name: Run crypto demo (proof it works)
        run: mvn -B org.codehaus.mojo:exec-maven-plugin:3.3.0:java -Dexec.mainClass="com.example.cbom.CryptoDemo"

      - name: Ensure demo keystore exists (for CBOM cert inventory)
        run: |
          if [ ! -f keystore.p12 ]; then
            keytool -genkeypair -alias demo -keyalg RSA -keysize 2048 \
              -storetype PKCS12 -keystore keystore.p12 \
              -storepass changeit -keypass changeit \
              -dname "CN=cbom-demo, OU=POC, O=Example, L=BLR, C=IN" -validity 365
          fi
          keytool -list -keystore keystore.p12 -storepass changeit | head -20

      # Single method: GHCR image (bundled java+maven+atom, reproducible)
      # NOTE: --user root avoids EACCES on the mounted workspace.
      - name: Generate CBOM via ghcr.io/cyclonedx/cdxgen
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/app" -w /app \
            ghcr.io/cyclonedx/cdxgen:latest \
            -t java --include-crypto --evidence \
            --spec-version 1.6 -o cbom.json -p .
          sudo chown -R $USER:$USER "${{ github.workspace }}" || true
          echo "=== cbom.json (head) ==="
          head -c 2000 cbom.json; echo

      - name: CBOM summary (crypto inventory)
        if: always()
        run: |
          echo "## CBOM POC result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f cbom.json ]; then
            comps=$(jq '.components | length' cbom.json)
            cryptos=$(jq '[.components[] | select(.cryptoProperties != null or .type=="cryptographic-asset")] | length' cbom.json)
            echo "Components: $comps, crypto assets: $cryptos" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Crypto algorithms found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jq -r '.components[] | select(.cryptoProperties != null) | "\(.name // .["bom-ref"]) -> \(.cryptoProperties.assetType // "?") / \(.cryptoProperties.algorithmRef // "?")"' cbom.json | sort -u | head -40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Crypto lib components" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jq -r '.components[] | "\(.group // ""):\(.name)@\(.version)"' cbom.json | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "cbom.json MISSING — check the Generate CBOM step log." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload BOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbom-poc-bom
          path: |
            cbom.json
            keystore.p12
